name: Build unsigned IPA

on:
  push:
    branches: [main, 'add-ipa-ci']
    paths:
      - 'ci/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # required to save the build caches

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 350

    env:
      JOBS: 3

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select recent Xcode
        # macos-15 ships several Xcodes; pick the newest 16.x so libc++ has
        # C++20 pieces FEXCore uses (std::atomic_ref) and the Metal toolchain
        # supports the converter's metallib output.
        run: |
          set -eu
          for v in 16.4 16.3 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_${v}.app/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build tools
        run: brew install cmake ninja meson bison flex pkgconf autoconf automake libtool ccache llvm

      # Restore/save are split so a *failed* run still saves its partial
      # progress (the plain cache action skips saving when the job fails).
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/llvm-mingw-20260421-ucrt-macos-universal
            toolchains/gnutls-ios
            toolchains/ffmpeg-ios
            toolchains/llvm-project
            toolchains/llvm-ios-build
            toolchains/llvm-host-build
            research/freetype
            FEX/build-ios
            wine/build-macos
            build/gnutls-ios/obj
            build/ffmpeg/obj
            build/freetype-ios/build
            build/ntdll-unix/obj
            build/win32u-unix/obj
            build/wineserver/obj
            build/dxmt-ios/obj
          key: madeira-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            madeira-v2-${{ runner.os }}-

      - name: Build and package unsigned IPA
        shell: bash
        # pipefail so a failing ci/build-ipa.sh is not masked by tee.
        run: |
          set -o pipefail
          bash ci/build-ipa.sh 2>&1 | tee build/ci-build.log

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/llvm-mingw-20260421-ucrt-macos-universal
            toolchains/gnutls-ios
            toolchains/ffmpeg-ios
            toolchains/llvm-project
            toolchains/llvm-ios-build
            toolchains/llvm-host-build
            research/freetype
            FEX/build-ios
            wine/build-macos
            build/gnutls-ios/obj
            build/ffmpeg/obj
            build/freetype-ios/build
            build/ntdll-unix/obj
            build/win32u-unix/obj
            build/wineserver/obj
            build/dxmt-ios/obj
          key: madeira-v2-${{ runner.os }}-${{ github.run_id }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-log
          path: build/ci-build.log
          if-no-files-found: ignore

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned-ipa
          path: |
            build/ipa-output/Madeira-unsigned.ipa
            build/ipa-output/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
