name: Build Madeira IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  IOS_DEPLOYMENT_TARGET: "17.0"

jobs:
  build:
    runs-on: macos-15

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # TOOLCHAIN
      # ============================================================

      - name: Select Xcode
        shell: bash
        run: |
          set -euxo pipefail

          sudo xcode-select -s "$DEVELOPER_DIR"

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos clang --version
          cmake --version
          ninja --version
          python3 --version

      # ============================================================
      # SUBMODULES
      # ============================================================

      - name: Initialize submodules
        shell: bash
        run: |
          set -euxo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        shell: bash
        run: |
          set -euxo pipefail

          python3 -m venv "$GITHUB_WORKSPACE/.venv"

          source "$GITHUB_WORKSPACE/.venv/bin/activate"

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install packaging

          python -c "import packaging; print(packaging.__version__)"

          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # ============================================================
      # SOURCE CHECK
      # ============================================================

      - name: Verify source tree
        shell: bash
        run: |
          set -euxo pipefail

          test -f FEX/CMakeLists.txt
          test -d FEX/FEXCore
          test -d FEX/FEXHeaderUtils
          test -d FEX/CodeEmitter

          test -d research/dxmt
          test -d wine

          test -f app/Madeira.xcodeproj/project.pbxproj

          test -x build/ntdll-unix/build.sh
          test -x build/win32u-unix/build.sh
          test -x build/wineserver/build.sh
          test -x build/dxmt-ios/build.sh

      # ============================================================
      # FREETYPE
      # ============================================================

      - name: Fetch FreeType
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf research/freetype

          mkdir -p research

          git clone \
            --depth 1 \
            --branch VER-2-13-3 \
            https://github.com/freetype/freetype.git \
            research/freetype

          test -f research/freetype/CMakeLists.txt

      - name: Build FreeType
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x build/freetype-ios/build.sh

          ./build/freetype-ios/build.sh

          test -f build/freetype-ios/build/libfreetype.a

      # ============================================================
      # GNUTLS
      # ============================================================

      - name: Build GnuTLS
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x build/gnutls-ios/build.sh

          ./build/gnutls-ios/build.sh

      # ============================================================
      # FEX CMAKE FIX
      #
      # The Madeira FEX fork already supports Darwin/iOS.
      #
      # The problem is that Apple's CMake platform can leave
      # CMAKE_SYSTEM_PROCESSOR empty.
      #
      # We force arm64 BEFORE FEX performs architecture detection.
      #
      # We also use TUNE_CPU=none below, which prevents FEX from
      # running its Linux /proc/cpuinfo native CPU detection.
      # ============================================================

      - name: Prepare FEX for iOS
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("FEX/CMakeLists.txt")
          text = path.read_text()

          marker = "## Architecture Handling ##"

          if marker not in text:
              raise SystemExit(
                  "ERROR: FEX architecture section was not found."
              )

          if "MADEIRA_IOS_FORCE_PROCESSOR" not in text:
              patch = r'''
          # Madeira iOS build:
          # Apple CMake may leave CMAKE_SYSTEM_PROCESSOR empty.
          if (CMAKE_SYSTEM_NAME STREQUAL "iOS")
            set(CMAKE_SYSTEM_PROCESSOR "arm64" CACHE STRING
                "Target processor" FORCE)
          endif()

          # MADEIRA_IOS_FORCE_PROCESSOR
          '''

              text = text.replace(
                  marker,
                  patch + "\n" + marker,
                  1
              )

              path.write_text(text)

          print("FEX iOS processor handling prepared.")

          PY

          grep -n -A10 -B3 "MADEIRA_IOS_FORCE_PROCESSOR" \
            FEX/CMakeLists.txt

      # ============================================================
      # CONFIGURE FEXCORE
      # ============================================================

      - name: Configure FEXCore
        shell: bash
        run: |
          set -euxo pipefail

          source "$GITHUB_WORKSPACE/.venv/bin/activate"

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          rm -rf FEX/build-ios

          cmake \
            -S FEX \
            -B FEX/build-ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DBUILD_TESTING=OFF \
            -DBUILD_STEAM_SUPPORT=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF \
            -DBUILD_THUNKS=OFF \
            -DENABLE_VIXL_DISASSEMBLER=OFF \
            -DENABLE_VIXL_SIMULATOR=OFF \
            -DENABLE_ZYDIS=OFF \
            -DENABLE_FEX_ALLOCATOR=OFF \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DENABLE_CCACHE=OFF \
            -DTUNE_CPU=none \
            -DTUNE_ARCH=generic

      # ============================================================
      # BUILD FEXCORE
      # ============================================================

      - name: Build FEXCore
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build FEX/build-ios \
            --target FEXCore FEXCore_Base JemallocLibs \
            --parallel "$(sysctl -n hw.ncpu)"

      # ============================================================
      # VERIFY FEX
      # ============================================================

      - name: Verify FEX libraries
        shell: bash
        run: |
          set -euxo pipefail

          echo "FEX static libraries:"

          find FEX/build-ios \
            -type f \
            -name "*.a" \
            -print \
            | sort

          FEXCORE="$(find FEX/build-ios \
            -type f \
            -name "libFEXCore.a" \
            -print \
            -quit)"

          FEXBASE="$(find FEX/build-ios \
            -type f \
            -name "libFEXCore_Base.a" \
            -print \
            -quit)"

          JEMALLOC="$(find FEX/build-ios \
            -type f \
            -name "libJemallocLibs.a" \
            -print \
            -quit)"

          test -n "$FEXCORE"
          test -n "$FEXBASE"
          test -n "$JEMALLOC"

          echo "$FEXCORE"
          echo "$FEXBASE"
          echo "$JEMALLOC"

          lipo -info "$FEXCORE"
          lipo -info "$FEXBASE"
          lipo -info "$JEMALLOC"

      # ============================================================
      # WINE
      # ============================================================

      - name: Build ntdll unix
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x build/ntdll-unix/build.sh
          ./build/ntdll-unix/build.sh

      - name: Build win32u unix
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x build/win32u-unix/build.sh
          ./build/win32u-unix/build.sh

      - name: Build wineserver
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x build/wineserver/build.sh
          ./build/wineserver/build.sh

      # ============================================================
      # DXMT
      # ============================================================

      - name: Build DXMT
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x build/dxmt-ios/build.sh
          ./build/dxmt-ios/build.sh

      # ============================================================
      # VERIFY NATIVE LIBRARIES
      # ============================================================

      - name: Verify native libraries
        shell: bash
        run: |
          set -euxo pipefail

          required=(
            "build/freetype-ios/build/libfreetype.a"
            "app/Madeira/libwineserver.a"
            "app/Madeira/libntdll_unix.a"
            "app/Madeira/libwin32u_unix.a"
            "app/Madeira/libdxmt_unix.a"
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "MISSING: $file"
              exit 1
            fi

            echo "OK: $file"
            ls -lh "$file"
          done

          FEXCORE="$(find FEX/build-ios \
            -type f \
            -name "libFEXCore.a" \
            -print \
            -quit)"

          FEXBASE="$(find FEX/build-ios \
            -type f \
            -name "libFEXCore_Base.a" \
            -print \
            -quit)"

          test -n "$FEXCORE"
          test -n "$FEXBASE"

      # ============================================================
      # PREFIX
      # ============================================================

      - name: Build prefix snapshot
        shell: bash
        run: |
          set -euxo pipefail

          if [ -x scripts/build-prefix-snapshot.sh ]; then
            ./scripts/build-prefix-snapshot.sh
          else
            echo "Prefix snapshot script not present."
          fi

      # ============================================================
      # XCODE PROJECT
      # ============================================================

      - name: Inspect Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          test -f app/Madeira.xcodeproj/project.pbxproj

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -list

      # ============================================================
      # BUILD MADEIRA.APP
      # ============================================================

      - name: Build Madeira.app
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build/xcode

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/xcode \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build

      # ============================================================
      # FIND APP
      # ============================================================

      - name: Locate Madeira.app
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(find build/xcode \
            -type d \
            -name "Madeira.app" \
            -print \
            -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: Madeira.app was not produced."

            find build/xcode \
              -type d \
              -name "*.app" \
              -print || true

            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$APP"

      # ============================================================
      # VERIFY APP
      # ============================================================

      - name: Verify Madeira.app
        shell: bash
        run: |
          set -euxo pipefail

          test -d "$APP"
          test -f "$APP/Madeira"

          file "$APP/Madeira"
          lipo -info "$APP/Madeira"

      # ============================================================
      # CREATE IPA
      # ============================================================

      - name: Create IPA
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf artifacts

          mkdir -p artifacts/Payload

          cp -R "$APP" artifacts/Payload/Madeira.app

          cd artifacts

          zip -qry Madeira.ipa Payload

          cd ..

          test -f artifacts/Madeira.ipa

          ls -lh artifacts/Madeira.ipa

      # ============================================================
      # VERIFY IPA
      # ============================================================

      - name: Verify IPA
        shell: bash
        run: |
          set -euxo pipefail

          test -f artifacts/Madeira.ipa

          unzip -t artifacts/Madeira.ipa

          unzip -l artifacts/Madeira.ipa \
            | grep -q "Payload/Madeira.app/"

          unzip -l artifacts/Madeira.ipa \
            | grep -q "Payload/Madeira.app/Madeira"

          echo "=========================================="
          echo "MADEIRA IPA CREATED SUCCESSFULLY"
          echo "=========================================="

          ls -lh artifacts/Madeira.ipa

      # ============================================================
      # UPLOAD IPA
      # ============================================================

      - name: Upload Madeira IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: artifacts/Madeira.ipa
          if-no-files-found: error
          retention-days: 7
