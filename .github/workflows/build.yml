name: Build Madeira

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show environment
        run: |
          set -euxo pipefail

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos clang --version
          cmake --version
          ninja --version
          python3 --version

      - name: Initialize submodules
        run: |
          set -euxo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive

      # ============================================================
      # Build FEXCore for iOS ARM64
      # ============================================================
      - name: Configure FEXCore
        run: |
          set -euxo pipefail

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          mkdir -p FEX/build-ios

          cmake -S FEX -B FEX/build-ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBUILD_STEAM_SUPPORT=ON \
            -DENABLE_VIXL_DISASSEMBLER=OFF \
            -DENABLE_VIXL_SIMULATOR=OFF \
            -DENABLE_ZYDIS=OFF

      - name: Build FEXCore
        run: |
          set -euxo pipefail

          cmake --build FEX/build-ios \
            --parallel "$(sysctl -n hw.ncpu)"

      # ============================================================
      # Show FEX output
      # ============================================================
      - name: Verify FEXCore
        run: |
          set -euxo pipefail

          find FEX/build-ios \
            -name '*.a' \
            -type f \
            -print

      # ============================================================
      # Build FreeType
      # ============================================================
      - name: Build FreeType
        run: |
          set -euxo pipefail

          if [ ! -x build/freetype-ios/build.sh ]; then
            echo "ERROR: build/freetype-ios/build.sh not found"
            exit 1
          fi

          ./build/freetype-ios/build.sh

      # ============================================================
      # Build GnuTLS
      # ============================================================
      - name: Build GnuTLS
        run: |
          set -euxo pipefail

          if [ ! -x build/gnutls-ios/build.sh ]; then
            echo "ERROR: build/gnutls-ios/build.sh not found"
            exit 1
          fi

          ./build/gnutls-ios/build.sh

      # ============================================================
      # Build ntdll unix
      # ============================================================
      - name: Build ntdll unix
        run: |
          set -euxo pipefail
          ./build/ntdll-unix/build.sh

      # ============================================================
      # Build win32u unix
      # ============================================================
      - name: Build win32u unix
        run: |
          set -euxo pipefail
          ./build/win32u-unix/build.sh

      # ============================================================
      # Build wineserver
      # ============================================================
      - name: Build wineserver
        run: |
          set -euxo pipefail
          ./build/wineserver/build.sh

      # ============================================================
      # Build DXMT
      # ============================================================
      - name: Build DXMT iOS unix
        run: |
          set -euxo pipefail
          ./build/dxmt-ios/build.sh

      # ============================================================
      # Verify libraries
      # ============================================================
      - name: Verify required libraries
        run: |
          set -euxo pipefail

          echo "=== Searching FEX libraries ==="

          find FEX/build-ios \
            -name '*.a' \
            -type f \
            -print

          echo ""
          echo "=== Required Madeira libraries ==="

          required=(
            "app/Madeira/libwineserver.a"
            "app/Madeira/libntdll_unix.a"
            "app/Madeira/libwin32u_unix.a"
            "app/Madeira/libdxmt_unix.a"
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "MISSING: $file"
              exit 1
            fi

            echo "OK: $file"
            ls -lh "$file"
          done

      # ============================================================
      # Build prefix snapshot
      # ============================================================
      - name: Build prefix snapshot
        run: |
          set -euxo pipefail

          if [ ! -x scripts/build-prefix-snapshot.sh ]; then
            echo "ERROR: scripts/build-prefix-snapshot.sh not found"
            exit 1
          fi

          ./scripts/build-prefix-snapshot.sh

      # ============================================================
      # Verify Xcode project
      # ============================================================
      - name: Verify Xcode project
        run: |
          set -euxo pipefail

          test -d app/Madeira.xcodeproj
          test -f app/Madeira.xcodeproj/project.pbxproj

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -list

      # ============================================================
      # Build Madeira.app
      # ============================================================
      - name: Build Madeira.app
        run: |
          set -euxo pipefail

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # ============================================================
      # Locate app
      # ============================================================
      - name: Locate Madeira.app
        run: |
          set -euxo pipefail

          echo "=== Searching for Madeira.app ==="

          find "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d \
            -name "Madeira.app" \
            -print

      # ============================================================
      # Package IPA
      # ============================================================
      - name: Create IPA
        run: |
          set -euxo pipefail

          APP="$(
            find "$HOME/Library/Developer/Xcode/DerivedData" \
              -type d \
              -name "Madeira.app" \
              -print \
              | head -1
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: Madeira.app not found"
            exit 1
          fi

          echo "Using:"
          echo "$APP"

          rm -rf artifacts
          mkdir -p artifacts/Payload

          cp -R "$APP" artifacts/Payload/Madeira.app

          cd artifacts

          zip -qry Madeira.ipa Payload

          echo ""
          echo "=== IPA CREATED ==="
          ls -lh Madeira.ipa

      # ============================================================
      # Upload IPA
      # ============================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: artifacts/Madeira.ipa
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # Upload app as backup
      # ============================================================
      - name: Upload Madeira.app
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-app
          path: artifacts/Payload/Madeira.app
          if-no-files-found: error
          retention-days: 7  
