name: Build Madeira

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        run: |
          set -euxo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive

      # ============================================================
      # TOOLCHAIN
      # ============================================================

      - name: Show toolchain
        run: |
          set -euxo pipefail

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos clang --version
          cmake --version
          ninja --version
          python3 --version

      # ============================================================
      # PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Python dependencies
        run: |
          set -euxo pipefail

          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user packaging setuptools

          python3 - <<'PY'
          import packaging
          print("packaging:", packaging.__version__)
          PY

      # ============================================================
      # FEX PATCHES FOR macOS/iOS CONFIGURATION
      # ============================================================

      - name: Prepare FEX for iOS cross compilation
        run: |
          set -euxo pipefail

          echo "Preparing FEX..."

          # FEX's NeedDisabledSVE.py expects Linux /proc/cpuinfo.
          # We are cross compiling on macOS, so provide a harmless
          # deterministic answer through a temporary replacement.

          cat > FEX/Scripts/NeedDisabledSVE.py <<'PY'
          import sys

          # iOS ARM64 target.
          # macOS host has no /proc/cpuinfo, and we don't want host CPU
          # feature detection to affect the iOS target configuration.

          print("False")
          sys.exit(0)
          PY

          echo "FEX preparation complete."

      # ============================================================
      # FEXCORE
      # ============================================================

      - name: Configure FEXCore
        run: |
          set -euxo pipefail

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          rm -rf FEX/build-ios
          mkdir -p FEX/build-ios

          cmake \
            -S FEX \
            -B FEX/build-ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBUILD_STEAM_SUPPORT=OFF \
            -DENABLE_VIXL_DISASSEMBLER=OFF \
            -DENABLE_VIXL_SIMULATOR=OFF \
            -DENABLE_ZYDIS=OFF \
            -DENABLE_ASSERTIONS=OFF

      - name: Build FEXCore
        run: |
          set -euxo pipefail

          cmake \
            --build FEX/build-ios \
            --parallel "$(sysctl -n hw.ncpu)"

      # ============================================================
      # VERIFY FEX
      # ============================================================

      - name: Verify FEX libraries
        run: |
          set -euxo pipefail

          echo "=== FEX static libraries ==="

          find FEX/build-ios \
            -type f \
            -name '*.a' \
            -print

          echo ""

          find FEX/build-ios \
            -type f \
            \( \
              -name 'libFEXCore.a' \
              -o -name 'libFEXCore_Base.a' \
              -o -name 'libJemallocLibs.a' \
              -o -name 'libfmt.a' \
              -o -name 'libxxhash.a' \
              -o -name 'libcephes_128bit.a' \
              -o -name 'libsoftfloat_3e.a' \
            \) \
            -print

      # ============================================================
      # FREETYPE
      # ============================================================

      - name: Build FreeType
        run: |
          set -euxo pipefail

          test -x build/freetype-ios/build.sh

          ./build/freetype-ios/build.sh

      # ============================================================
      # GNUTLS
      # ============================================================

      - name: Build GnuTLS
        run: |
          set -euxo pipefail

          test -x build/gnutls-ios/build.sh

          ./build/gnutls-ios/build.sh

      # ============================================================
      # WINE NTDLL UNIX
      # ============================================================

      - name: Build ntdll unix
        run: |
          set -euxo pipefail

          ./build/ntdll-unix/build.sh

      # ============================================================
      # WINE WIN32U UNIX
      # ============================================================

      - name: Build win32u unix
        run: |
          set -euxo pipefail

          ./build/win32u-unix/build.sh

      # ============================================================
      # WINE SERVER
      # ============================================================

      - name: Build wineserver
        run: |
          set -euxo pipefail

          ./build/wineserver/build.sh

      # ============================================================
      # DXMT
      # ============================================================

      - name: Build DXMT
        run: |
          set -euxo pipefail

          ./build/dxmt-ios/build.sh

      # ============================================================
      # VERIFY MADEIRA LIBRARIES
      # ============================================================

      - name: Verify Madeira libraries
        run: |
          set -euxo pipefail

          required=(
            "app/Madeira/libwineserver.a"
            "app/Madeira/libntdll_unix.a"
            "app/Madeira/libwin32u_unix.a"
            "app/Madeira/libdxmt_unix.a"
          )

          echo "=== Checking Madeira libraries ==="

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "MISSING: $file"
              exit 1
            fi

            echo "OK: $file"
            ls -lh "$file"
          done

      # ============================================================
      # PREFIX
      # ============================================================

      - name: Build prefix snapshot
        run: |
          set -euxo pipefail

          test -x scripts/build-prefix-snapshot.sh

          ./scripts/build-prefix-snapshot.sh

      # ============================================================
      # XCODE PROJECT
      # ============================================================

      - name: Check Xcode project
        run: |
          set -euxo pipefail

          test -d app/Madeira.xcodeproj
          test -f app/Madeira.xcodeproj/project.pbxproj

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -list

      # ============================================================
      # BUILD MADEIRA
      # ============================================================

      - name: Build Madeira.app
        run: |
          set -euxo pipefail

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # ============================================================
      # FIND APP
      # ============================================================

      - name: Find Madeira.app
        run: |
          set -euxo pipefail

          find \
            "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d \
            -name "Madeira.app" \
            -print

      # ============================================================
      # CREATE IPA
      # ============================================================

      - name: Create IPA
        run: |
          set -euxo pipefail

          APP="$(
            find \
              "$HOME/Library/Developer/Xcode/DerivedData" \
              -type d \
              -name "Madeira.app" \
              -print \
              | head -1
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: Madeira.app was not found"
            exit 1
          fi

          echo "Found:"
          echo "$APP"

          rm -rf artifacts
          mkdir -p artifacts/Payload

          cp -R "$APP" artifacts/Payload/Madeira.app

          cd artifacts

          zip -qry Madeira.ipa Payload

          echo ""
          echo "======================================"
          echo "           MADEIRA IPA"
          echo "======================================"

          ls -lh Madeira.ipa

      # ============================================================
      # UPLOAD IPA
      # ============================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: artifacts/Madeira.ipa
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # UPLOAD APP BACKUP
      # ============================================================

      - name: Upload Madeira.app
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-app
          path: artifacts/Payload/Madeira.app
          if-no-files-found: error
          retention-days: 7
