name: Build Madeira IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  IOS_DEPLOYMENT_TARGET: "17.0"

jobs:
  build:
    runs-on: macos-15

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # TOOLCHAIN
      # ============================================================

      - name: Select Xcode and inspect toolchain
        shell: bash
        run: |
          set -euxo pipefail

          sudo xcode-select -s "$DEVELOPER_DIR"

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos clang --version
          cmake --version
          ninja --version
          python3 --version
          git --version

      # ============================================================
      # SUBMODULES
      # ============================================================

      - name: Initialize submodules
        shell: bash
        run: |
          set -euxo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Create Python virtual environment
        shell: bash
        run: |
          set -euxo pipefail

          python3 -m venv "$GITHUB_WORKSPACE/.venv"

          source "$GITHUB_WORKSPACE/.venv/bin/activate"

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install packaging

          python - <<'PY'
          import packaging
          print("packaging:", packaging.__version__)
          PY

          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # ============================================================
      # SOURCE VALIDATION
      # ============================================================

      - name: Verify Madeira source tree
        shell: bash
        run: |
          set -euxo pipefail

          required=(
            "FEX/CMakeLists.txt"
            "FEX/Source"
            "FEX/include"
            "research/dxmt"
            "wine"
            "app/Madeira.xcodeproj"
            "build/freetype-ios/build.sh"
            "build/gnutls-ios/build.sh"
            "build/ntdll-unix/build.sh"
            "build/win32u-unix/build.sh"
            "build/wineserver/build.sh"
            "build/dxmt-ios/build.sh"
          )

          for item in "${required[@]}"; do
            if [ ! -e "$item" ]; then
              echo "ERROR: missing $item"
              exit 1
            fi

            echo "OK: $item"
          done

      # ============================================================
      # FREETYPE SOURCE
      # ============================================================

      - name: Fetch FreeType
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d research/freetype ]; then
            git clone \
              --depth 1 \
              --branch VER-2-13-3 \
              https://github.com/freetype/freetype.git \
              research/freetype
          fi

          test -f research/freetype/CMakeLists.txt

      # ============================================================
      # FREETYPE
      # ============================================================

      - name: Build FreeType
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x build/freetype-ios/build.sh

          ./build/freetype-ios/build.sh

          test -f build/freetype-ios/build/libfreetype.a

          echo "FreeType built:"
          ls -lh build/freetype-ios/build/libfreetype.a

      # ============================================================
      # GNUTLS
      # ============================================================

      - name: Build GnuTLS
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x build/gnutls-ios/build.sh

          ./build/gnutls-ios/build.sh

      # ============================================================
      # FEX iOS COMPATIBILITY PATCH
      #
      # Madeira's FEX fork contains FEXCore code that can be built
      # for Apple/ARM64, but the FEX top-level CMake still contains
      # Linux/Windows-only host checks and Linux /proc assumptions.
      #
      # We patch ONLY the checked-out CI copy.
      # The Git repository itself is not changed.
      # ============================================================

      - name: Patch FEX for iOS
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          cmake = Path("FEX/CMakeLists.txt")

          if not cmake.is_file():
              raise SystemExit("ERROR: FEX/CMakeLists.txt not found")

          text = cmake.read_text()

          original = text

          # --------------------------------------------------------
          # 1. Allow iOS in the FEX platform check.
          #
          # Original upstream-style logic rejects everything except
          # Linux and Windows.
          # --------------------------------------------------------

          old = '''elseif (NOT (WIN32 OR CMAKE_SYSTEM_NAME STREQUAL "Linux"))'''

          new = '''elseif (NOT (
    WIN32 OR
    CMAKE_SYSTEM_NAME STREQUAL "Linux" OR
    CMAKE_SYSTEM_NAME STREQUAL "iOS"
  ))'''

          if old in text:
              text = text.replace(old, new, 1)
              print("Patched FEX platform check.")
          elif 'CMAKE_SYSTEM_NAME STREQUAL "iOS"' in text:
              print("FEX platform check already allows iOS.")
          else:
              raise SystemExit(
                  "ERROR: Could not locate FEX platform check. "
                  "Refusing to modify an unknown CMake layout."
              )

          # --------------------------------------------------------
          # 2. FEX tries to execute:
          #
          #   aarch64_fit_native.py /proc/cpuinfo
          #
          # macOS has no /proc/cpuinfo.
          #
          # For an iOS ARM64 build we use a deterministic baseline
          # CPU instead of inspecting the GitHub runner CPU.
          # --------------------------------------------------------

          pattern = re.compile(
              r'execute_process\(\s*'
              r'COMMAND\s+python3\s+'
              r'"\$\{PROJECT_SOURCE_DIR\}/Scripts/aarch64_fit_native\.py"\s+'
              r'"/proc/cpuinfo"\s+'
              r'"\$\{CMAKE_CXX_COMPILER_VERSION\}"\s*'
              r'OUTPUT_VARIABLE\s+AARCH64_CPU\s*\)',
              re.MULTILINE
          )

          replacement = 'set(AARCH64_CPU "cortex-a78")'

          text, count = pattern.subn(replacement, text, count=1)

          if count:
              print("Disabled Linux /proc/cpuinfo CPU detection.")
          elif 'set(AARCH64_CPU "cortex-a78")' in text:
              print("AArch64 CPU fallback already present.")
          else:
              raise SystemExit(
                  "ERROR: Could not locate aarch64_fit_native.py invocation."
              )

          # --------------------------------------------------------
          # 3. Make string(STRIP ...) safe even if CPU detection
          #    accidentally returns an empty string.
          # --------------------------------------------------------

          text = text.replace(
              'string(STRIP ${AARCH64_CPU} AARCH64_CPU)',
              'string(STRIP "${AARCH64_CPU}" AARCH64_CPU)',
              1
          )

          # --------------------------------------------------------
          # 4. Do not execute NeedDisabledSVE.py.
          #
          # That script also assumes /proc/cpuinfo.
          #
          # iOS target configuration does not need the Linux host
          # CPU feature probe.
          # --------------------------------------------------------

          pattern_sve = re.compile(
              r'execute_process\(\s*'
              r'COMMAND\s+python3\s+'
              r'"\$\{PROJECT_SOURCE_DIR\}/Scripts/NeedDisabledSVE\.py"\s*'
              r'RESULT_VARIABLE\s+NEEDS_SVE_DISABLED\s*\)',
              re.MULTILINE
          )

          replacement_sve = 'set(NEEDS_SVE_DISABLED 0)'

          text, count_sve = pattern_sve.subn(
              replacement_sve,
              text,
              count=1
          )

          if count_sve:
              print("Disabled Linux SVE host probing.")
          elif 'set(NEEDS_SVE_DISABLED 0)' in text:
              print("SVE probe already disabled.")
          else:
              raise SystemExit(
                  "ERROR: Could not locate NeedDisabledSVE.py invocation."
              )

          if text == original:
              raise SystemExit(
                  "ERROR: FEX patch made no changes."
              )

          cmake.write_text(text)

          print("FEX CMake patch complete.")
          PY

          echo
          echo "===== Patched FEX platform section ====="
          grep -n -A12 -B4 "CMAKE_SYSTEM_NAME STREQUAL" FEX/CMakeLists.txt || true

          echo
          echo "===== Patched CPU section ====="
          grep -n -A12 -B6 "AARCH64_CPU" FEX/CMakeLists.txt || true

      # ============================================================
      # CONFIGURE FEX
      # ============================================================

      - name: Configure FEXCore
        shell: bash
        run: |
          set -euxo pipefail

          source "$GITHUB_WORKSPACE/.venv/bin/activate"

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          rm -rf FEX/build-ios

          cmake \
            -S FEX \
            -B FEX/build-ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DBUILD_TESTING=OFF \
            -DBUILD_STEAM_SUPPORT=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF \
            -DBUILD_THUNKS=OFF \
            -DENABLE_VIXL_DISASSEMBLER=OFF \
            -DENABLE_VIXL_SIMULATOR=OFF \
            -DENABLE_ZYDIS=OFF \
            -DENABLE_FEX_ALLOCATOR=OFF \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DENABLE_CCACHE=OFF \
            -DTUNE_CPU=cortex-a78

      # ============================================================
      # BUILD FEX
      # ============================================================

      - name: Build FEXCore
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build FEX/build-ios \
            --parallel "$(sysctl -n hw.ncpu)"

      # ============================================================
      # VERIFY FEX
      # ============================================================

      - name: Verify FEXCore
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== FEX static libraries ====="

          find FEX/build-ios \
            -type f \
            -name "*.a" \
            -print \
            | sort

          FEXCORE="$(find FEX/build-ios \
            -type f \
            -name 'libFEXCore.a' \
            -print \
            -quit)"

          FEXBASE="$(find FEX/build-ios \
            -type f \
            -name 'libFEXCore_Base.a' \
            -print \
            -quit)"

          JEMALLOC="$(find FEX/build-ios \
            -type f \
            -name 'libJemallocLibs.a' \
            -print \
            -quit)"

          if [ -z "$FEXCORE" ]; then
            echo "ERROR: libFEXCore.a not found"
            exit 1
          fi

          if [ -z "$FEXBASE" ]; then
            echo "ERROR: libFEXCore_Base.a not found"
            exit 1
          fi

          if [ -z "$JEMALLOC" ]; then
            echo "ERROR: libJemallocLibs.a not found"
            exit 1
          fi

          echo "FEXCore:      $FEXCORE"
          echo "FEXCore_Base: $FEXBASE"
          echo "Jemalloc:     $JEMALLOC"

          lipo -info "$FEXCORE"
          lipo -info "$FEXBASE"
          lipo -info "$JEMALLOC"

      # ============================================================
      # WINE UNIX LIBRARIES
      # ============================================================

      - name: Build ntdll unix
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x build/ntdll-unix/build.sh
          ./build/ntdll-unix/build.sh

      - name: Build win32u unix
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x build/win32u-unix/build.sh
          ./build/win32u-unix/build.sh

      - name: Build wineserver
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x build/wineserver/build.sh
          ./build/wineserver/build.sh

      # ============================================================
      # DXMT
      # ============================================================

      - name: Build DXMT iOS
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x build/dxmt-ios/build.sh
          ./build/dxmt-ios/build.sh

      # ============================================================
      # VERIFY ALL REQUIRED LIBRARIES
      # ============================================================

      - name: Verify native libraries
        shell: bash
        run: |
          set -euxo pipefail

          required=(
            "build/freetype-ios/build/libfreetype.a"
            "FEX/build-ios/FEXCore/Source/libFEXCore.a"
            "FEX/build-ios/FEXCore/Source/libFEXCore_Base.a"
            "FEX/build-ios/FEXCore/Source/libJemallocLibs.a"
            "FEX/build-ios/External/fmt/libfmt.a"
            "FEX/build-ios/External/cephes/libcephes_128bit.a"
            "FEX/build-ios/External/xxhash/cmake_unofficial/libxxhash.a"
            "FEX/build-ios/External/SoftFloat-3e/libsoftfloat_3e.a"
            "app/Madeira/libwineserver.a"
            "app/Madeira/libntdll_unix.a"
            "app/Madeira/libwin32u_unix.a"
            "app/Madeira/libdxmt_unix.a"
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo
              echo "============================================================"
              echo "MISSING REQUIRED LIBRARY"
              echo "$file"
              echo "============================================================"
              echo

              find . \
                -type f \
                \( -name '*.a' -o -name '*.dylib' \) \
                -print \
                | sort

              exit 1
            fi

            echo "OK: $file"
            ls -lh "$file"
          done

      # ============================================================
      # PREFIX
      # ============================================================

      - name: Build prefix snapshot
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f scripts/build-prefix-snapshot.sh ]; then
            echo "ERROR: prefix script missing"
            exit 1
          fi

          chmod +x scripts/build-prefix-snapshot.sh

          ./scripts/build-prefix-snapshot.sh

      # ============================================================
      # INSPECT XCODE
      # ============================================================

      - name: Inspect Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          test -f app/Madeira.xcodeproj/project.pbxproj

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -list

      # ============================================================
      # BUILD MADEIRA.APP
      # ============================================================

      - name: Build Madeira.app
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build/xcode

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/xcode \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build

      # ============================================================
      # LOCATE APP
      # ============================================================

      - name: Locate Madeira.app
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(find build/xcode \
            -type d \
            -name "Madeira.app" \
            -print \
            -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: Madeira.app was not produced."

            find build/xcode \
              -maxdepth 8 \
              -type d \
              -name "*.app" \
              -print || true

            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$APP"

      # ============================================================
      # VERIFY APP
      # ============================================================

      - name: Verify Madeira.app
        shell: bash
        run: |
          set -euxo pipefail

          test -d "$APP"
          test -f "$APP/Madeira"

          echo "===== Main executable ====="

          file "$APP/Madeira"
          lipo -info "$APP/Madeira"

          echo
          echo "===== App contents ====="

          find "$APP" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

      # ============================================================
      # CREATE UNSIGNED IPA
      # ============================================================

      - name: Create IPA
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf artifacts

          mkdir -p artifacts/Payload

          cp -R "$APP" artifacts/Payload/Madeira.app

          # Remove accidental signatures if any.
          find artifacts/Payload/Madeira.app \
            -name "_CodeSignature" \
            -type d \
            -prune \
            -exec rm -rf {} +

          cd artifacts

          /usr/bin/zip \
            -qry \
            Madeira.ipa \
            Payload

          cd ..

          test -f artifacts/Madeira.ipa

          echo
          echo "============================================================"
          echo "IPA CREATED"
          echo "============================================================"

          ls -lh artifacts/Madeira.ipa

      # ============================================================
      # VERIFY IPA
      # ============================================================

      - name: Verify IPA
        shell: bash
        run: |
          set -euxo pipefail

          test -f artifacts/Madeira.ipa

          unzip -t artifacts/Madeira.ipa

          unzip -l artifacts/Madeira.ipa \
            | grep -q "Payload/Madeira.app/Madeira"

          unzip -l artifacts/Madeira.ipa \
            | grep -q "Payload/Madeira.app/Info.plist"

          echo
          echo "============================================================"
          echo "IPA VERIFIED SUCCESSFULLY"
          echo "============================================================"

          ls -lh artifacts/Madeira.ipa

      # ============================================================
      # UPLOAD IPA
      # ============================================================

      - name: Upload Madeira IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: artifacts/Madeira.ipa
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # ALSO UPLOAD APP
      # ============================================================

      - name: Archive Madeira.app
        shell: bash
        run: |
          set -euxo pipefail

          cd "$(dirname "$APP")"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$(basename "$APP")" \
            "$GITHUB_WORKSPACE/artifacts/Madeira.app.zip"

      - name: Upload Madeira.app
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-app
          path: artifacts/Madeira.app.zip
          if-no-files-found: error
          retention-days: 7
