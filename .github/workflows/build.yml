name: Build Madeira

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Inspect toolchains
        run: |
          echo "Repository:"
          pwd
          echo
          echo "Toolchains:"
          find toolchains -maxdepth 3 -type f -perm -111 2>/dev/null | head -100 || true

      - name: Inspect build scripts
        run: |
          echo "Build scripts:"
          find build -name build.sh -print

      - name: Build required components
        shell: bash
        run: |
          set -e

          for dir in \
            build/crypto-unix \
            build/freetype-ios \
            build/gnutls-ios \
            build/ntdll-unix \
            build/win32u-unix \
            build/wineios-drv \
            build/wineserver
          do
            if [ -f "$dir/build.sh" ]; then
              echo "===== $dir ====="
              chmod +x "$dir/build.sh"
              (
                cd "$dir"
                ./build.sh
              )
            fi
          done

      - name: Build DXMT
        shell: bash
        run: |
          set -e

          if [ -f build/dxmt-ios/build.sh ]; then
            chmod +x build/dxmt-ios/build.sh
            cd build/dxmt-ios
            ./build.sh
          fi

      - name: Build FEX
        shell: bash
        run: |
          set -e

          if [ -f FEX/build.sh ]; then
            chmod +x FEX/build.sh
            ./FEX/build.sh
          else
            echo "No FEX/build.sh found; continuing"
          fi

      - name: Show Xcode project
        run: |
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -list

      - name: Build Madeira
        run: |
          set -e

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate app
        run: |
          find "$GITHUB_WORKSPACE/DerivedData" \
            -name "Madeira.app" \
            -type d \
            -print

      - name: Package IPA
        shell: bash
        run: |
          set -e

          APP=$(find "$GITHUB_WORKSPACE/DerivedData" \
            -name "Madeira.app" \
            -type d | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: Madeira.app not found"
            exit 1
          fi

          rm -rf Payload
          mkdir Payload

          cp -R "$APP" Payload/Madeira.app

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            Payload Madeira.ipa

          ls -lh Madeira.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa
            
