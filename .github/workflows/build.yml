name: Build Madeira

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify project
        run: |
          set -euo pipefail

          test -f app/Madeira.xcodeproj/project.pbxproj
          test -f app/Madeira/MadeiraApp.swift
          test -f app/Madeira/Info.plist

          echo "Project OK"

      - name: Check FEX libraries
        run: |
          set -euo pipefail

          files=(
            "FEX/build-ios/FEXCore/Source/libFEXCore.a"
            "FEX/build-ios/FEXCore/Source/libFEXCore_Base.a"
            "FEX/build-ios/FEXCore/Source/libJemallocLibs.a"
            "FEX/build-ios/External/fmt/libfmt.a"
            "FEX/build-ios/External/cephes/libcephes_128bit.a"
            "FEX/build-ios/External/xxhash/cmake_unofficial/libxxhash.a"
            "FEX/build-ios/External/SoftFloat-3e/libsoftfloat_3e.a"
            "app/Madeira/libwineserver.a"
            "app/Madeira/libntdll_unix.a"
            "app/Madeira/libwin32u_unix.a"
            "app/Madeira/libdxmt_combined.a"
          )

          missing=0

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "OK $file"
            else
              echo "MISSING $file"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Required libraries are missing."
            exit 1
          fi

      - name: Build Madeira
        run: |
          set -o pipefail

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            2>&1 | tee xcodebuild.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madeira-build-log
          path: xcodebuild.log
