name: Build Madeira IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # Toolchain
      # ============================================================
      - name: Show toolchain
        run: |
          set -euxo pipefail

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos clang --version
          cmake --version
          ninja --version
          python3 --version
          git --version

      # ============================================================
      # Submodules
      # ============================================================
      - name: Initialize submodules
        run: |
          set -euxo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive

      # ============================================================
      # Python virtual environment
      #
      # IMPORTANT:
      # macOS-15 now uses Python 3.14 / PEP 668.
      # Do NOT use:
      #   pip install --user
      #
      # FEX requires "packaging" for aarch64_fit_native.py.
      # ============================================================
      - name: Setup Python environment
        shell: bash
        run: |
          set -euxo pipefail

          python3 -m venv .venv

          source .venv/bin/activate

          python -m pip install --upgrade pip
          python -m pip install packaging

          python - <<'PY'
          import packaging
          print("packaging:", packaging.__version__)
          PY

      # ============================================================
      # Put venv first in PATH for ALL following steps
      # ============================================================
      - name: Export Python environment
        run: |
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # ============================================================
      # Build FreeType
      # ============================================================
      - name: Build FreeType
        run: |
          set -euxo pipefail

          if [ ! -f build/freetype-ios/build.sh ]; then
            echo "ERROR: build/freetype-ios/build.sh not found"
            exit 1
          fi

          chmod +x build/freetype-ios/build.sh
          ./build/freetype-ios/build.sh

      # ============================================================
      # Build GnuTLS
      # ============================================================
      - name: Build GnuTLS
        run: |
          set -euxo pipefail

          if [ ! -f build/gnutls-ios/build.sh ]; then
            echo "ERROR: build/gnutls-ios/build.sh not found"
            exit 1
          fi

          chmod +x build/gnutls-ios/build.sh
          ./build/gnutls-ios/build.sh

      # ============================================================
      # Build FEXCore for iOS / ARM64
      #
      # IMPORTANT:
      # - No modification of FEX/CMakeLists.txt
      # - Explicit ARM64 processor
      # - VIXL/Zydis disabled
      # - Steam support disabled because its CMake install rules
      #   expect a macOS bundle destination and fail on iOS.
      # ============================================================
      - name: Build FEXCore
        shell: bash
        run: |
          set -euxo pipefail

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          rm -rf FEX/build-ios
          mkdir -p FEX/build-ios

          cmake \
            -S FEX \
            -B FEX/build-ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DBUILD_TESTING=OFF \
            -DBUILD_STEAM_SUPPORT=OFF \
            -DENABLE_VIXL_DISASSEMBLER=OFF \
            -DENABLE_VIXL_SIMULATOR=OFF \
            -DENABLE_ZYDIS=OFF

          cmake --build FEX/build-ios --parallel "$(sysctl -n hw.ncpu)"

      # ============================================================
      # Verify FEX
      # ============================================================
      - name: Verify FEXCore
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching for FEXCore libraries..."

          find FEX/build-ios \
            -type f \
            \( \
              -name 'libFEXCore.a' \
              -o -name 'libFEXCore_Base.a' \
              -o -name 'libJemallocLibs.a' \
            \) \
            -print

          test -f FEX/build-ios/FEXCore/Source/libFEXCore.a
          test -f FEX/build-ios/FEXCore/Source/libFEXCore_Base.a
          test -f FEX/build-ios/FEXCore/Source/libJemallocLibs.a

      # ============================================================
      # Build Wine dependencies
      # ============================================================
      - name: Build ntdll unix
        run: |
          set -euxo pipefail

          chmod +x build/ntdll-unix/build.sh
          ./build/ntdll-unix/build.sh

      - name: Build win32u unix
        run: |
          set -euxo pipefail

          chmod +x build/win32u-unix/build.sh
          ./build/win32u-unix/build.sh

      - name: Build wineserver
        run: |
          set -euxo pipefail

          chmod +x build/wineserver/build.sh
          ./build/wineserver/build.sh

      # ============================================================
      # Build DXMT
      # ============================================================
      - name: Build DXMT iOS unix library
        run: |
          set -euxo pipefail

          chmod +x build/dxmt-ios/build.sh
          ./build/dxmt-ios/build.sh

      # ============================================================
      # Verify all static libraries
      # ============================================================
      - name: Verify required libraries
        shell: bash
        run: |
          set -euxo pipefail

          required=(
            "FEX/build-ios/FEXCore/Source/libFEXCore.a"
            "FEX/build-ios/FEXCore/Source/libFEXCore_Base.a"
            "FEX/build-ios/FEXCore/Source/libJemallocLibs.a"
            "FEX/build-ios/External/fmt/libfmt.a"
            "FEX/build-ios/External/cephes/libcephes_128bit.a"
            "FEX/build-ios/External/xxhash/cmake_unofficial/libxxhash.a"
            "FEX/build-ios/External/SoftFloat-3e/libsoftfloat_3e.a"
            "app/Madeira/libwineserver.a"
            "app/Madeira/libntdll_unix.a"
            "app/Madeira/libwin32u_unix.a"
            "app/Madeira/libdxmt_unix.a"
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo
              echo "============================================================"
              echo "MISSING LIBRARY:"
              echo "$file"
              echo "============================================================"
              echo

              find . \
                -type f \
                \( \
                  -name '*.a' \
                  -o -name '*.dylib' \
                \) \
                -print | sort

              exit 1
            fi

            echo "OK: $file"
            ls -lh "$file"
          done

      # ============================================================
      # Build prefix
      # ============================================================
      - name: Build prefix snapshot
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f scripts/build-prefix-snapshot.sh ]; then
            echo "ERROR: scripts/build-prefix-snapshot.sh not found"
            exit 1
          fi

          chmod +x scripts/build-prefix-snapshot.sh
          ./scripts/build-prefix-snapshot.sh

      # ============================================================
      # Build Madeira.app
      # ============================================================
      - name: Build Madeira.app
        shell: bash
        run: |
          set -euxo pipefail

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build

      # ============================================================
      # Locate app
      # ============================================================
      - name: Locate Madeira.app
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching for Madeira.app..."

          find "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d \
            -name "Madeira.app" \
            -print

      # ============================================================
      # Create unsigned IPA
      #
      # IPA structure:
      #
      # Madeira.ipa
      # └── Payload/
      #     └── Madeira.app/
      #
      # This IPA is intentionally unsigned.
      # You sign/install it later with your preferred method.
      # ============================================================
      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d \
            -name 'Madeira.app' \
            -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: Madeira.app not found"
            exit 1
          fi

          echo "Using app:"
          echo "$APP"

          rm -rf artifacts
          mkdir -p artifacts/Payload

          cp -R "$APP" artifacts/Payload/Madeira.app

          # Remove any accidental code signatures.
          find artifacts/Payload/Madeira.app \
            -name "_CodeSignature" \
            -type d \
            -prune \
            -exec rm -rf {} +

          # Create proper IPA.
          cd artifacts

          /usr/bin/zip \
            -qry \
            Madeira.ipa \
            Payload

          # Also keep the raw app.
          cd ..

          cp -R artifacts/Payload/Madeira.app artifacts/Madeira.app

          echo
          echo "============================================================"
          echo "IPA CREATED"
          echo "============================================================"

          ls -lh artifacts/Madeira.ipa
          du -sh artifacts/Madeira.app

          echo
          echo "IPA CONTENTS:"
          unzip -l artifacts/Madeira.ipa | head -50

      # ============================================================
      # Upload IPA
      # ============================================================
      - name: Upload Madeira IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: artifacts/Madeira.ipa
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # Upload raw app too
      # ============================================================
      - name: Upload Madeira.app
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-app
          path: artifacts/Madeira.app
          if-no-files-found: error
          retention-days: 7
