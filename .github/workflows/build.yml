name: Build Madeira

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          brew install cmake ninja meson pkg-config python

      - name: Download prebuilt llvm-mingw
        run: |
          set -e

          VERSION=20260421
          URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${VERSION}/llvm-mingw-${VERSION}-ucrt-macos-universal.tar.xz"

          curl -L --fail --retry 3 "$URL" -o llvm-mingw.tar.xz

          mkdir -p toolchains
          tar -xf llvm-mingw.tar.xz -C toolchains

          DIR=$(find toolchains -maxdepth 1 -type d -name "llvm-mingw-*" | head -1)

          mv "$DIR" toolchains/llvm-mingw-20260421-ucrt-macos-universal

      - name: Verify llvm-mingw
        run: |
          set -e

          TOOLCHAIN="$GITHUB_WORKSPACE/toolchains/llvm-mingw-20260421-ucrt-macos-universal"

          echo "Toolchain:"
          find "$TOOLCHAIN/bin" -maxdepth 1 -type f | head -30

          test -x "$TOOLCHAIN/bin/x86_64-w64-mingw32-clang"

          "$TOOLCHAIN/bin/x86_64-w64-mingw32-clang" --version

      - name: Build Madeira native components
        run: |
          set -e

          chmod +x build/*/build.sh 2>/dev/null || true
          chmod +x build/*/compile_patched.sh 2>/dev/null || true

          ./build/d3d11-triangle/build.sh

      - name: Show build result
        if: always()
        run: |
          echo "=== Built files ==="
          find . \
            -type f \
            \( -name "*.a" -o -name "*.dylib" -o -name "*.framework" -o -name "*.app" \) \
            -not -path "./.git/*" \
            | head -200

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madeira-build
          path: |
            build/**/*.a
            build/**/*.dylib
            build/**/*.framework
            app/**/*.app
          if-no-files-found: warn    
