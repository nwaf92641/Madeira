name: Build Madeira

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja meson python3 pkg-config

      - name: Install llvm-mingw
        run: |
          git clone --depth 1 https://github.com/mstorsjo/llvm-mingw.git /tmp/llvm-mingw

          cd /tmp/llvm-mingw
          ./build-all.sh /tmp/llvm-mingw-build

      - name: Locate llvm-mingw
        run: |
          find /tmp/llvm-mingw-build -type f \
            -name 'x86_64-w64-mingw32-clang' \
            -print

      - name: Prepare Madeira toolchain
        run: |
          mkdir -p toolchains
          cp -R /tmp/llvm-mingw-build toolchains/llvm-mingw-20260421-ucrt-macos-universal

      - name: Verify toolchain
        run: |
          TOOLCHAIN="toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin/x86_64-w64-mingw32-clang"

          if [ ! -f "$TOOLCHAIN" ]; then
            echo "ERROR: llvm-mingw clang was not found:"
            echo "$TOOLCHAIN"
            find toolchains -maxdepth 5 -type f | head -200
            exit 1
          fi

          chmod +x "$TOOLCHAIN"
          "$TOOLCHAIN" --version

      - name: Build Madeira
        run: |
          set -e
          chmod +x build/*/build.sh 2>/dev/null || true
          ./build/d3d11-triangle/build.sh

      - name: Build iOS app
        run: |
          set -e
          xcodebuild \
            -project app/Madeira/Madeira.xcodeproj \
            -scheme Madeira \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Madeira.xcarchive" \
            archive

      - name: Package IPA
        run: |
          mkdir -p Payload

          cp -R \
            "$RUNNER_TEMP/Madeira.xcarchive/Products/Applications/Madeira.app" \
            Payload/

          zip -r Madeira.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa
