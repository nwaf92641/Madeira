name: ipa

# Builds an UNSIGNED Madeira.ipa by calling scripts/make-ipa.sh -- the same
# script you run locally, so CI and a local build cannot drift.
#
# Read this before expecting it to work on a GitHub-hosted runner:
#
#   Most of what this app links is NOT in the repository. FEX, the wineserver /
#   ntdll / win32u layer and DXMT are gitignored build products (see
#   .gitignore, "Compiled libraries"), and the three submodules they come from
#   are empty in a clean clone. On a fresh checkout the link step cannot run at
#   all: 11 of the 15 required archives are absent.
#
#   So this workflow only succeeds on a runner whose working tree has already
#   been built -- a self-hosted Mac that has built the app. That is what the
#   `runner` input is for. A GitHub-hosted runner will stop at the preflight in
#   make-ipa.sh, which names each missing archive and the script that produces
#   it, instead of failing inside ld.
#
#   Publishing the built archives as a release asset and restoring them before
#   the build is the other way to make this work on a hosted runner.
#
# Why unsigned: this app cannot ship through the App Store (JIT needs a debugger
# attach), so it is sideloaded, and the sideloader re-signs it with the user's
# own Apple ID. That re-sign is where the JIT entitlements come from.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner label. Must be a machine whose tree has the prebuilt archives
          (self-hosted macOS), or a hosted runner will stop at the preflight.
        required: false
        default: macos-15
        type: string

permissions:
  contents: read

jobs:
  unsigned-ipa:
    name: unsigned ipa
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and package
        run: scripts/make-ipa.sh --output Madeira-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned-ipa
          path: Madeira-unsigned.ipa
          if-no-files-found: error
